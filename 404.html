<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Chamidu Kanishka</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
      .not-found { max-width: 560px; padding: 2rem; border-radius: 24px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
      .not-found h1 { font-size: clamp(3rem, 8vw, 5rem); margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div class="not-found">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you requested could not be found. Return to the main portfolio and continue exploring.</p>
      <a class="btn btn-primary" href="index.html">Back to Home</a>
    </div>
  </body>
</html>
